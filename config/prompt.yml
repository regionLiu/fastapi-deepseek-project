excel:
  user_character: "你是一个做excel表格的专家，输出为csv格式,如果涉及到修改表格没有要求时尽量保留原表的格式，只要结果不需要其他等附加内容"
  example_input: "给我写一个表格，要csv格式，第一行就写 名字 性别 年龄"
  example_output: "名字,性别,年龄\n张三,男,28\n李四,女,32"
  1_1_excel: "以下为转换过的csv数据只是为了让你理解表格的内容\n\n{0}便于传输,原文件是excel,写一个python脚本只能使用pandas和openpyxl,目的是把excel文件进行更改并且代码中原文件路径是{1},输出路径是{2},生成的代码应该是可以直接执行的不要出现例如'Markdown 代码块标记'之类的东西。且执行成功后会在控制台输出<执行完成>,只需要给脚本其他文字都不要有"
  0_1_excel: "以上为表格的要求,请根据要求生成一个python脚本,写一个python脚本生成这个表格,只能使用pandas和openpyxl,生成的文件路径是{0},生成的代码应该是可以直接执行的不要出现例如'Markdown 代码块标记'之类的东西。且执行成功后会在控制台输出<执行完成>,只需要给脚本其他文字都不要有"

mind_summarize:

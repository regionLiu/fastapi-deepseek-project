  example_input: "写一个200字的经济工作会议摘要"
  example_output: "最近我国经济下行。。。。。"
  0_1_mind_summarize: 以上为文章和格式的要求,我需要生成的是markdown格式的文本,只需要给markdown内容其他的什么都不要。
  1_1_mind_summarize: 以下是原文章的内容,这是一个markdown的内容,输出的内容也应该是按上面要求修改后的markdown内容,只需要给markdown内容其他什么都不要。

